<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love ❤️</title>
    <link rel="stylesheet" href="love.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>❤️ My Love ❤️</h1>
            <p class="subtitle">You are my today and all of my tomorrows</p>

            <img src="https://i.imgur.com/4M34hi2.png" alt="Love Image" class="love-img">

            <p class="message">
                Every moment with you feels special.  
                Thank you for being the reason behind my smile.  
                I’m lucky to have you 💕
            </p>

            <button class="love-btn">Forever Yours 💖</button>
        </div>
    </div>

</body>
</html>
